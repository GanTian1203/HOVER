[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hover-reproduction"
version = "0.4.0"
description = "Frozen-backbone history and forecast-conditioned residual adaptation"
requires-python = ">=3.8"
dependencies = ["torch>=2.0,<2.1", "numpy>=1.23,<1.24", "pandas>=1.5,<1.6", "scipy>=1.10,<1.11", "matplotlib>=3.7,<3.8", "psutil>=5.9,<6"]

[project.optional-dependencies]
baselines = ["einops==0.5.0", "reformer-pytorch==1.4.4", "timm==0.6.13", "charset-normalizer==3.3.2", "seaborn==0.13.2", "torchvision>=0.15,<0.16"]

[project.scripts]
hover = "hover.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hover = ["configuration/*.json"]
